[package]
name = "za2-core"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[[bin]]
name = "za2-replay"
path = "src/bin/replay.rs"
